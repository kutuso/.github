<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="kutu OS — the RAM-sipping Linux desktop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11111b"/>
      <stop offset="0.55" stop-color="#181825"/>
      <stop offset="1" stop-color="#1e1e2e"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB3BA"/>
      <stop offset="0.17" stop-color="#FFDFBA"/>
      <stop offset="0.34" stop-color="#FFFFBA"/>
      <stop offset="0.51" stop-color="#BAFFC9"/>
      <stop offset="0.68" stop-color="#BAE1FF"/>
      <stop offset="0.85" stop-color="#D4BAFF"/>
      <stop offset="1" stop-color="#FFB3E6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D4BAFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#D4BAFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#BAE1FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#BAE1FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e2e6f3" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse cx="1030" cy="90" rx="420" ry="240" fill="url(#glow)"/>
  <ellipse cx="180" cy="360" rx="380" ry="220" fill="url(#glow2)"/>

  <g transform="rotate(-18 640 210)" opacity="0.16">
    <rect x="820" y="-200" width="64" height="900" fill="#FFB3BA"/>
    <rect x="884" y="-200" width="64" height="900" fill="#FFDFBA"/>
    <rect x="948" y="-200" width="64" height="900" fill="#FFFFBA"/>
    <rect x="1012" y="-200" width="64" height="900" fill="#BAFFC9"/>
    <rect x="1076" y="-200" width="64" height="900" fill="#BAE1FF"/>
    <rect x="1140" y="-200" width="64" height="900" fill="#D4BAFF"/>
    <rect x="1204" y="-200" width="64" height="900" fill="#FFB3E6"/>
  </g>
  <rect x="0" y="416" width="1280" height="4" fill="url(#rainbow)"/>

  <text x="84" y="196" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="104" font-weight="800" fill="#e2e6f3" letter-spacing="-3">kutu <tspan fill="url(#rainbow)">OS</tspan></text>
  <text x="88" y="248" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#9aa0b8">the RAM-sipping Linux desktop</text>
  <text x="88" y="292" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="16" fill="#6c7086">zswap · MGLRU · DAMON · PSI-driven oomd — per-app memory ceilings</text>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="19">
    <rect x="84" y="330" width="118" height="40" rx="20" fill="#181825" stroke="#BAE1FF" stroke-opacity="0.55"/>
    <text x="143" y="356" text-anchor="middle" fill="#BAE1FF">kutuso/os</text>
    <rect x="218" y="330" width="152" height="40" rx="20" fill="#181825" stroke="#D4BAFF" stroke-opacity="0.55"/>
    <text x="294" y="356" text-anchor="middle" fill="#D4BAFF">kutuso/doctor</text>
    <rect x="386" y="330" width="222" height="40" rx="20" fill="#181825" stroke="#FFB3E6" stroke-opacity="0.55"/>
    <text x="497" y="356" text-anchor="middle" fill="#FFB3E6">kutuso/libmempressure</text>
  </g>
</svg>
